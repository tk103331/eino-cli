name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build binaries (goreleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish npm package (Trusted Publishing)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version

      - name: Set package version from tag
        run: cd npm && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Enabled once the npm package has a GitHub Actions trusted publisher
      # configured (repo variable NPM_TRUSTED_PUBLISHING=true).
      - name: Publish to npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: cd npm && npm publish --access public --provenance

  brew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Update tap formula
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_GITHUB_TOKEN }}
          TAP_REPO: tk103331/homebrew-tap
          VERSION: ${{ github.ref_name }}
        run: bash scripts/update-tap.sh
