version: 2

project_name: eino-cli

before:
  hooks:
    - go mod tidy

builds:
  # Short alias binary: eino
  - id: eino
    main: ./cmd/eino
    binary: eino
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tk103331/eino-cli/version.Version={{ .Version }}

  # Primary binary: eino-cli
  - id: eino-cli
    main: .
    binary: eino-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tk103331/eino-cli/version.Version={{ .Version }}

# Ship compressed archives: a stripped binary is ~50 MB, while gzip brings the
# download down to ~15 MB. The npm installer and the Homebrew formula unpack
# `eino` from eino_<version>_<os>_<arch>.tar.gz.
archives:
  - id: eino
    ids: [eino]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: eino-cli
    ids: [eino-cli]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: tk103331
    name: eino-cli
  draft: false
  prerelease: auto
